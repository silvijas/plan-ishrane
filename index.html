/* ==========================================================================
   6. ACTIONS
   One click handler for the whole app. A button says what it does with
   data-action, and the matching function below changes the state.
   ========================================================================== */

const $ = id => document.getElementById(id);
const VIEWS = { danas: viewDanas, recepti: viewRecepti, kupovina: viewKupovina, vezbe: viewVezbe, vise: viewVise };

function render() {
  $('view').innerHTML = state.startDate ? VIEWS[ui.tab]() : viewStart();
  document.querySelector('.tabs').hidden = !state.startDate;
  document.querySelectorAll('.tab').forEach(btn => {
    const on = btn.dataset.tab === ui.tab;
    btn.classList.toggle('is-on', on);
    if (on) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });
  startDemos();
}

// Show another page: draw it and go back to the top
function go() {
  render();
  window.scrollTo(0, 0);
}

// Save and redraw after a change on the current page
function update() {
  save();
  render();
}

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), 2600);
}

const clampDay = i => Math.min(PLAN_DAYS - 1, Math.max(0, i));

function beginPlan(dateText) {
  if (!dateText) return;
  state.startDate = dateText;
  ui.day = clampDay(todayIndex());
  ui.shopWeek = upcomingShopWeek();
  ui.tab = 'danas';
  save();
  go();
}

// ---------- Rest and hold timer ----------

let timer = null;               // { endsAt, onDone }
let timerInterval = null;

function startTimer(label, seconds, onDone) {
  timer = { endsAt: Date.now() + seconds * 1000, onDone: onDone || null };
  const bar = $('timer');
  bar.classList.remove('is-over');
  bar.innerHTML = `<span class="num" id="timer-num"></span><span class="tb-label">${label}</span><button class="btn btn-small" data-action="timer-stop">Preskoči</button>`;
  bar.hidden = false;
  document.body.classList.add('has-timer');
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  timer = null;
  clearInterval(timerInterval);
  $('timer').hidden = true;
  document.body.classList.remove('has-timer');
}

function tickTimer() {
  if (!timer) return;
  const left = Math.ceil((timer.endsAt - Date.now()) / 1000);
  if (left > 0) {
    $('timer-num').textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
    return;
  }
  const onDone = timer.onDone;
  stopTimer();
  if (navigator.vibrate) navigator.vibrate(200);
  if (onDone) { onDone(); return; }

  const bar = $('timer');
  bar.classList.add('is-over');
  bar.innerHTML = `<span class="tb-label">Pauza je gotova, sledeća serija.</span><button class="btn btn-small" data-action="timer-stop">U redu</button>`;
  bar.hidden = false;
  setTimeout(() => { if (!timer) $('timer').hidden = true; }, 6000);
}

// Called after a set is ticked: start the rest, move on, or finish the workout
function afterSet(i, ex) {
  const day = getDay(i);
  const allDone = EXERCISES.every(e => (day.sets[e.id] || 0) >= e.sets);
  if (allDone) {
    day.done.trening = true;
    stopTimer();
    toast('Trening je završen.');
    return;
  }
  if (day.sets[ex.id] >= ex.sets) {
    const next = EXERCISES.find(e => (day.sets[e.id] || 0) < e.sets);
    if (next) ui.exercise = next.id;
  }
  startTimer('Pauza', state.settings.rest);
}

// ---------- Actions ----------

const ACTIONS = {
  // Navigation
  'tab'(d) {
    if (ui.tab === d.tab) { ui.recipe = null; ui.more = null; ui.swap = null; }
    if (d.tab === 'recepti') ui.recipeBack = 'recepti';
    ui.tab = d.tab;
    ui.pickOpen = null;
    ui.confirmReset = false;
    go();
  },
  'start'(d) { beginPlan(d.date); },
  'start-from-input'() { beginPlan($('start-date').value); },
  'goto-day'(d) { ui.day = Number(d.day); ui.tab = 'danas'; ui.pickOpen = null; go(); },
  'open-recipe'(d) { if (ui.tab !== 'recepti') ui.recipeBack = ui.tab; ui.tab = 'recepti'; ui.recipe = d.id; go(); },
  'close-recipe'() { ui.recipe = null; ui.tab = ui.recipeBack; ui.recipeBack = 'recepti'; go(); },
  'open-shop'(d) { ui.tab = 'kupovina'; ui.shopView = 'lista'; ui.shopWeek = Number(d.week); go(); },
  'more'(d) { ui.more = d.page || null; ui.swap = null; ui.confirmReset = false; go(); },

  // Today
  'toggle-task'(d) {
    const now = toggleTask(Number(d.day), d.key);
    if (d.key === 'kuvanje' && now) toast('Četiri kutije su u frižideru.');
    update();
  },
  'toggle-pick'(d) { ui.pickOpen = ui.pickOpen === d.key ? null : d.key; render(); },
  'pick'(d) { getDay(Number(d.day)).pick[d.key] = d.value; ui.pickOpen = null; update(); },
  // Lunch or dinner: back to the plan, a quick meal ('q:id') or a box from the fridge ('box:w:s')
  'choose-meal'(d) {
    const i = Number(d.day), day = getDay(i);
    const plannedQuick = mealFor(i, d.key).type === 'quick';
    if (!day.swap) day.swap = {};
    if (d.value === 'plan') {
      delete day.swap[d.key];
    } else if (d.value.startsWith('q:') && plannedQuick) {
      day.pick[d.key] = d.value.slice(2);
      delete day.swap[d.key];
    } else {
      day.swap[d.key] = d.value.startsWith('q:') ? d.value.slice(2) : d.value;
    }
    ui.pickOpen = null;
    update();
  },
  'toggle-extra'(d) { const day = getDay(Number(d.day)); day.extra = !day.extra; update(); },

  // Shopping list
  'shop-view'(d) { ui.shopView = d.view; go(); },
  'shop-week'(d) { ui.shopWeek = Number(d.week); render(); },
  'toggle-shop'(d) { toggleShopItem(Number(d.week), d.id); update(); },
  'add-extra-item'() {
    const name = $('extra-name').value.trim();
    if (!name) return;
    shopOf(ui.shopWeek).extra.push({ id: 'x' + Date.now(), name, done: false });
    update();
  },
  'toggle-extra-item'(d) {
    const item = shopOf(Number(d.week)).extra.find(x => x.id === d.id);
    if (item) item.done = !item.done;
    update();
  },
  'remove-extra-item'(d) {
    const shop = shopOf(Number(d.week));
    shop.extra = shop.extra.filter(x => x.id !== d.id);
    update();
  },

  // Pantry
  'pantry-step'(d) { state.pantry[d.id] = Math.max(0, (state.pantry[d.id] || 0) + Number(d.delta)); update(); },
  'pantry-toggle'(d) { state.pantry[d.id] = !state.pantry[d.id]; update(); },
  'add-custom'() {
    const name = $('custom-name').value.trim();
    if (!name) return;
    state.custom.push({ id: 'c' + Date.now(), name, qty: 1 });
    update();
  },
  'custom-step'(d) {
    const item = state.custom.find(x => x.id === d.id);
    if (item) item.qty = Math.max(0, item.qty + Number(d.delta));
    update();
  },
  'remove-custom'(d) { state.custom = state.custom.filter(x => x.id !== d.id); update(); },

  // Workout
  'open-exercise'(d) { ui.exercise = ui.exercise === d.id ? null : d.id; render(); },
  'toggle-demo'() { ui.demoPaused = !ui.demoPaused; render(); },
  'set-done'(d) {
    const i = Number(d.day), n = Number(d.set);
    const ex = EXERCISES.find(e => e.id === d.id);
    const day = getDay(i);
    if (n <= (day.sets[ex.id] || 0)) {          // tapping a finished set takes it back
      day.sets[ex.id] = n - 1;
      day.done.trening = false;
      stopTimer();
    } else {
      day.sets[ex.id] = n;
      afterSet(i, ex);
    }
    update();
  },
  'set-rest'(d) { state.settings.rest = Number(d.seconds); update(); },
  'set-hold'(d) { state.settings.hold = Number(d.seconds); update(); },
  'start-hold'(d) {
    const i = Number(d.day);
    const plank = EXERCISES.find(e => e.hold);
    if ((peekDay(i).sets[plank.id] || 0) >= plank.sets) { toast('Sve serije su već urađene.'); return; }
    startTimer('Plank, drži', state.settings.hold, () => {
      const day = getDay(i);
      day.sets[plank.id] = Math.min(plank.sets, (day.sets[plank.id] || 0) + 1);
      afterSet(i, plank);
      update();
    });
  },
  'timer-stop'() { stopTimer(); },

  // Plan overview
  'swap'(d) { ui.swap = { week: Number(d.week), slot: Number(d.slot) }; go(); },
  'swap-cancel'() { ui.swap = null; go(); },
  'choose-dish'(d) {
    state.dishes[ui.swap.week][ui.swap.slot] = d.id;
    ui.swap = null;
    save();
    go();
  },

  // Progress
  'add-weight'() {
    const date = $('weight-date').value;
    const kg = Number(String($('weight-kg').value).replace(',', '.'));
    if (!date || !(kg >= 30 && kg <= 250)) { toast('Upiši težinu u kilogramima.'); return; }
    state.weights = state.weights.filter(w => w.date !== date);
    state.weights.push({ date, kg: Math.round(kg * 10) / 10 });
    state.weights.sort((a, b) => a.date.localeCompare(b.date));
    update();
  },
  'remove-weight'(d) { state.weights = state.weights.filter(w => w.date !== d.date); update(); },

  // Settings
  'change-start'() {
    const value = $('new-start').value;
    if (!value) return;
    state.startDate = value;
    ui.day = clampDay(todayIndex());
    ui.shopWeek = upcomingShopWeek();
    update();
    toast('Datum početka je sačuvan.');
  },
  async 'copy-backup'() {
    const box = $('backup-out');
    box.select();
    try {
      await navigator.clipboard.writeText(box.value);
      toast('Kopirano.');
    } catch (err) {
      toast('Tekst je označen, kopiraj ga ručno.');
    }
  },
  'restore-backup'() {
    let data = null;
    try { data = JSON.parse($('backup-in').value); } catch (err) { data = null; }
    if (!data || !data.version || !data.days || !Array.isArray(data.dishes)) {
      toast('Ovo nije ispravna kopija.');
      return;
    }
    state = Object.assign(defaultState(), data);
    if (state.startDate) ui.day = clampDay(todayIndex());
    save();
    go();
    toast('Kopija je učitana.');
  },
  'reset'() {
    if (!ui.confirmReset) { ui.confirmReset = true; render(); return; }
    ui.confirmReset = false;
    ui.tab = 'danas';
    ui.more = null;
    state = defaultState();
    stopTimer();
    save();
    go();
  }
};

// Identifies a button by its action and data, to find it again after a redraw
const buttonKey = el => JSON.stringify(Object.entries(el.dataset).sort());

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = ACTIONS[el.dataset.action];
  if (!action) return;
  const key = buttonKey(el);
  action({ ...el.dataset });

  // the page was redrawn, so put the keyboard focus back on the same button
  if (!document.body.contains(el)) {
    const same = [...document.querySelectorAll('[data-action]')].find(x => buttonKey(x) === key);
    if (same) same.focus({ preventScroll: true });
  }
});

// Number fields that save when the value changes
document.addEventListener('change', event => {
  const el = event.target;
  if (el.dataset.change === 'steps') {
    getDay(Number(el.dataset.day)).steps = Math.max(0, Math.round(Number(el.value) || 0)) || null;
    save();
  }
  if (el.dataset.change === 'goal') {
    const kg = Number(String(el.value).replace(',', '.'));
    state.goal = kg >= 30 && kg <= 250 ? kg : null;
    update();
  }
});

// Enter in a text field does the same as the button next to it
document.addEventListener('keydown', event => {
  if (event.key !== 'Enter' || !event.target.dataset || !event.target.dataset.enter) return;
  event.preventDefault();
  ACTIONS[event.target.dataset.enter]({});
});

// When the app is opened again on a new day, move from yesterday to today
let lastToday = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !state || !state.startDate) return;
  const today = clampDay(todayIndex());
  if (lastToday !== null && today !== lastToday && ui.day === lastToday) {
    ui.day = today;
    render();
  }
  lastToday = today;
});

async function init() {
  const saved = await store.load();
  state = Object.assign(defaultState(), saved || {});
  state.settings = Object.assign(defaultState().settings, state.settings);
  // respect the "reduce motion" system setting: demos start paused
  ui.demoPaused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (state.startDate) {
    ui.day = clampDay(todayIndex());
    ui.shopWeek = upcomingShopWeek();
    lastToday = ui.day;
  }
  render();
}

init();
</script>
